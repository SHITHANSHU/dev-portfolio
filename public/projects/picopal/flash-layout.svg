<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
<title id="t">PicoPal flash partition layout</title><desc id="d">4 MB flash: bootloader and partition table, 20 KB NVS, 8 KB otadata, two 1664 KB app slots app0 and app1, 640 KB LittleFS for voice clips, 64 KB coredump. An update writes the inactive slot, switches otadata, boots pending verify, and is marked valid after 60 seconds with Wi-Fi or rolled back after 5 minutes without it.</desc>
<rect width="1000" height="400" fill="#fbf9f4"/>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1b1a17">
<text x="30" y="40" font-size="20" text-anchor="start" font-weight="600" fill="#1b1a17">PicoPal — 4 MB flash layout (custom partition table)</text>
<text x="30" y="62" font-size="12" text-anchor="start" font-weight="400" fill="#6a665b">Two app slots let a new image be written while the old one keeps running; otadata decides which slot boots.</text>
<rect x="30.0" y="110" width="8.3" height="70" fill="#d9d4c6" stroke="#1b1a17" stroke-width="1.4"/>
<rect x="38.3" y="110" width="4.6" height="70" fill="#f0d9d1" stroke="#1b1a17" stroke-width="1.4"/>
<rect x="42.9" y="110" width="1.8" height="70" fill="#f0d9d1" stroke="#1b1a17" stroke-width="1.4"/>
<rect x="44.7" y="110" width="381.9" height="70" fill="#d6e4df" stroke="#1b1a17" stroke-width="1.4"/>
<text x="235.625" y="140" font-size="13" text-anchor="middle" font-weight="600" fill="#1b1a17">app0 (ota_0)</text>
<text x="235.625" y="160" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6a665b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1664 KB</text>
<rect x="426.6" y="110" width="381.9" height="70" fill="#d6e4df" stroke="#1b1a17" stroke-width="1.4"/>
<text x="617.5" y="140" font-size="13" text-anchor="middle" font-weight="600" fill="#1b1a17">app1 (ota_1)</text>
<text x="617.5" y="160" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6a665b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1664 KB</text>
<rect x="808.4" y="110" width="146.9" height="70" fill="#e1e8f5" stroke="#1b1a17" stroke-width="1.4"/>
<text x="881.875" y="140" font-size="13" text-anchor="middle" font-weight="600" fill="#1b1a17">LittleFS</text>
<text x="881.875" y="160" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6a665b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">640 KB</text>
<rect x="955.3" y="110" width="14.7" height="70" fill="#e8e3d6" stroke="#1b1a17" stroke-width="1.4"/>
<line x1="34.130859375" y1="180" x2="34.130859375" y2="200" stroke="#6a665b" stroke-width="1"/>
<line x1="34.130859375" y1="200" x2="64.130859375" y2="200" stroke="#6a665b" stroke-width="1"/>
<text x="68.130859375" y="204" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b1a17">bootloader + partition table</text>
<line x1="40.556640625" y1="180" x2="40.556640625" y2="222" stroke="#6a665b" stroke-width="1"/>
<line x1="40.556640625" y1="222" x2="70.556640625" y2="222" stroke="#6a665b" stroke-width="1"/>
<text x="74.556640625" y="226" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b1a17">nvs 20 KB: settings, Wi-Fi, calibration</text>
<line x1="43.76953125" y1="180" x2="43.76953125" y2="244" stroke="#6a665b" stroke-width="1"/>
<line x1="43.76953125" y1="244" x2="73.76953125" y2="244" stroke="#6a665b" stroke-width="1"/>
<text x="77.76953125" y="248" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b1a17">otadata 8 KB: which slot boots + state</text>
<line x1="962.65625" y1="180" x2="962.65625" y2="206" stroke="#6a665b" stroke-width="1"/>
<text x="962.65625" y="220" font-size="11.5" text-anchor="end" font-weight="400" fill="#1b1a17">coredump 64 KB</text>
<text x="44.6875" y="102" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6a665b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0x10000</text>
<text x="426.5625" y="102" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6a665b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0x1B0000</text>
<text x="808.4375" y="102" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6a665b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0x350000</text>
<text x="970.0" y="102" font-size="10.5" text-anchor="middle" font-weight="400" fill="#6a665b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0x400000</text>
<text x="30" y="290" font-size="14" text-anchor="start" font-weight="600" fill="#1b1a17">Update cycle</text>
<rect x="30" y="304" width="106.0" height="30" fill="#ffffff" stroke="#1b1a17" stroke-width="1.6"/>
<text x="83.0" y="324" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1b1a17">running app0</text>
<text x="140.0" y="324" font-size="16" text-anchor="start" font-weight="400" fill="#6a665b">›</text>
<rect x="152.0" y="304" width="155.0" height="30" fill="#ffffff" stroke="#1b1a17" stroke-width="1.6"/>
<text x="229.5" y="324" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1b1a17">write image to app1</text>
<text x="311.0" y="324" font-size="16" text-anchor="start" font-weight="400" fill="#6a665b">›</text>
<rect x="323.0" y="304" width="141.0" height="30" fill="#ffffff" stroke="#1b1a17" stroke-width="1.6"/>
<text x="393.5" y="324" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1b1a17">verify size + MD5</text>
<text x="468.0" y="324" font-size="16" text-anchor="start" font-weight="400" fill="#6a665b">›</text>
<rect x="480.0" y="304" width="176.0" height="30" fill="#ffffff" stroke="#1b1a17" stroke-width="1.6"/>
<text x="568.0" y="324" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1b1a17">otadata → app1, reboot</text>
<text x="660.0" y="324" font-size="16" text-anchor="start" font-weight="400" fill="#6a665b">›</text>
<rect x="672.0" y="304" width="197.0" height="30" fill="#ffffff" stroke="#1b1a17" stroke-width="1.6"/>
<text x="770.5" y="324" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1b1a17">app1 boots PENDING_VERIFY</text>
<text x="873.0" y="324" font-size="16" text-anchor="start" font-weight="400" fill="#6a665b">›</text>
<rect x="30" y="348" width="169.0" height="30" fill="#ffffff" stroke="#1d5b57" stroke-width="1.6"/>
<text x="114.5" y="368" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1d5b57">Wi-Fi up 60 s → VALID</text>
<text x="203.0" y="368" font-size="16" text-anchor="start" font-weight="400" fill="#6a665b">›</text>
<rect x="215.0" y="348" width="239.0" height="30" fill="#ffffff" stroke="#b3361a" stroke-width="1.6"/>
<text x="334.5" y="368" font-size="11.5" text-anchor="middle" font-weight="600" fill="#b3361a">else after 5 min → back to app0</text>
</g></svg>
