<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
<title id="t">PicoPal power domains</title><desc id="d">USB 5 V feeds the board's 5V pin, which powers the MAX98357A amplifier, and the onboard 3.3 V regulator, which powers the ESP32-C3, OLED, VL53L0X and TTP223. A separate external 5 V 2 A buck supply with a bulk capacitor powers the two SG90 servos. All grounds are common.</desc>
<rect width="1000" height="470" fill="#fbf9f4"/>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1b1a17">
<text x="30" y="40" font-size="20" text-anchor="start" font-weight="600" fill="#1b1a17">PicoPal — power domains</text>
<text x="30" y="62" font-size="12" text-anchor="start" font-weight="400" fill="#6a665b">Three rails. Servos never draw from the board. Currents are datasheet-level estimates from the project notes, not measurements.</text>
<rect x="30" y="110" width="190" height="60" fill="#ffffff" stroke="#b3361a" stroke-width="2"/><text x="42" y="134" font-size="14" text-anchor="start" font-weight="600" fill="#1b1a17">USB-C 5 V</text><text x="42" y="152" font-size="11" text-anchor="start" font-weight="400" fill="#6a665b">1 A+ port, short cable</text>
<rect x="300" y="90" width="220" height="60" fill="#ffffff" stroke="#b3361a" stroke-width="2"/><text x="312" y="114" font-size="14" text-anchor="start" font-weight="600" fill="#1b1a17">SuperMini 5V pin</text><text x="312" y="132" font-size="11" text-anchor="start" font-weight="400" fill="#6a665b">USB 5 V passthrough</text>
<rect x="300" y="190" width="220" height="60" fill="#ffffff" stroke="#b3361a" stroke-width="2"/><text x="312" y="214" font-size="14" text-anchor="start" font-weight="600" fill="#1b1a17">Onboard 3.3 V LDO</text><text x="312" y="232" font-size="11" text-anchor="start" font-weight="400" fill="#6a665b">≈ 500 mA total budget</text>
<line x1="220" y1="140" x2="300" y2="120" stroke="#b3361a" stroke-width="2.4"/><polygon points="300,120 291,115 291,125" fill="#b3361a"/>
<line x1="220" y1="140" x2="300" y2="220" stroke="#b3361a" stroke-width="2.4"/><polygon points="300,220 291,215 291,225" fill="#b3361a"/>
<rect x="610" y="80" width="360" height="60" fill="#ffffff" stroke="#1d5b57" stroke-width="2"/><text x="622" y="104" font-size="14" text-anchor="start" font-weight="600" fill="#1b1a17">MAX98357A amp + speaker</text><text x="622" y="122" font-size="11" text-anchor="start" font-weight="400" fill="#6a665b">peaks ≈ 0.6 A on loud sounds</text>
<line x1="520" y1="120" x2="610" y2="110" stroke="#b3361a" stroke-width="2.4"/><polygon points="610,110 601,105 601,115" fill="#b3361a"/>
<rect x="610" y="170" width="360" height="100" fill="#ffffff" stroke="#b3361a" stroke-width="2"/><text x="622" y="194" font-size="14" text-anchor="start" font-weight="600" fill="#1b1a17">3.3 V loads</text><text x="622" y="212" font-size="11" text-anchor="start" font-weight="400" fill="#6a665b"></text>
<text x="622" y="210" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b1a17">ESP32-C3: 25–80 mA, Wi-Fi TX peaks ≈ 350 mA</text>
<text x="622" y="228" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b1a17">OLED 10–25 mA · VL53L0X ≤ 20 mA</text>
<text x="622" y="246" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b1a17">TTP223 &lt; 0.01 mA · MPU6050 (optional) 4 mA</text>
<line x1="520" y1="220" x2="610" y2="220" stroke="#b3361a" stroke-width="2.4"/><polygon points="610,220 601,215 601,225" fill="#b3361a"/>
<rect x="30" y="330" width="190" height="60" fill="#ffffff" stroke="#c26a00" stroke-width="2"/><text x="42" y="354" font-size="14" text-anchor="start" font-weight="600" fill="#1b1a17">External 5 V buck</text><text x="42" y="372" font-size="11" text-anchor="start" font-weight="400" fill="#6a665b">≥ 2 A</text>
<rect x="300" y="330" width="220" height="60" fill="#ffffff" stroke="#c26a00" stroke-width="2"/><text x="312" y="354" font-size="14" text-anchor="start" font-weight="600" fill="#1b1a17">470–1000 µF bulk cap</text><text x="312" y="372" font-size="11" text-anchor="start" font-weight="400" fill="#6a665b">at the servos, mind polarity</text>
<rect x="610" y="320" width="360" height="80" fill="#ffffff" stroke="#c26a00" stroke-width="2"/><text x="622" y="344" font-size="14" text-anchor="start" font-weight="600" fill="#1b1a17">2 × SG90 servos</text><text x="622" y="362" font-size="11" text-anchor="start" font-weight="400" fill="#6a665b"></text>
<text x="622" y="362" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b1a17">≈ 650 mA each when stalled; ≈ 10 mA idle</text>
<text x="622" y="380" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b1a17">with PWM off (detached 0.5 s after a move)</text>
<line x1="220" y1="360" x2="300" y2="360" stroke="#c26a00" stroke-width="2.4"/><polygon points="300,360 291,355 291,365" fill="#c26a00"/>
<line x1="520" y1="360" x2="610" y2="360" stroke="#c26a00" stroke-width="2.4"/><polygon points="610,360 601,355 601,365" fill="#c26a00"/>
<line x1="30" y1="430" x2="970" y2="430" stroke="#1b1a17" stroke-width="3"/>
<text x="500" y="452" font-size="12" text-anchor="middle" font-weight="600" fill="#1b1a17">Common ground: USB GND, board GND, amp GND, servo brown wires and the external supply GND all join here</text>
</g></svg>
